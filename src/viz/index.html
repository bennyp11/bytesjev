<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlanningChecker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #f7f6ed; --text: #173344; --muted: #50656b; --line: #17334426; --accent: #446c60; --card: #fffdf5;
    --code-bg: #173943; --code-text: #fffbed; --warm: #bc602e; --cream: #f9e5be;
    --keep: #446c60; --simplify: #bc602e; --review: #50656b;
    --serif: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Avenir Next', system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { height: 100%; }
  body { margin: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { margin: 0; font-family: var(--serif); font-weight: 500; letter-spacing: -.03em; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid var(--warm); outline-offset: 4px; }
  .app { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* Header: the site's floating pill, flattened into a bar. */
  .bar { flex: none; z-index: 10; display: flex; align-items: center; gap: 18px; padding: 14px 28px; border-bottom: 1px solid #fff; background: linear-gradient(#f5fbffe8, #deedf5cc); backdrop-filter: blur(18px) saturate(1.05); -webkit-backdrop-filter: blur(18px) saturate(1.05); box-shadow: inset 0 -2px 3px #3a5e6520; }
  .brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; }
  .brand .name { font: 500 26px/1 var(--serif); letter-spacing: -.035em; }
  .brand .name::before { content: '/'; color: var(--accent); }
  .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 2.2px; text-transform: uppercase; color: var(--muted); }
  .eyebrow .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }
  .eyebrow.live .dot { animation: pulse 1.4s ease-in-out infinite; }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-left: auto; font-size: 12px; color: var(--muted); }
  .facts b { font-weight: 600; color: var(--text); }
  .btn { display: inline-flex; align-items: center; min-height: 34px; padding: 0 16px; border: 1px solid var(--line); border-radius: 20px; background: var(--card); font-size: 12px; font-weight: 600; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  .pane { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 26px 0 60px; }
  .wrap { width: min(880px, calc(100% - 56px)); margin-inline: auto; display: flex; flex-direction: column; gap: 26px; }
  .empty { border: 1px dashed var(--line); border-radius: 20px; padding: 36px; color: var(--muted); font-size: 14px; }
  .empty b { display: block; color: var(--text); font: 500 26px/1.2 var(--serif); margin-bottom: 8px; }

  /* One check: a card in the site's skill-card idiom. */
  .call { display: flex; flex-direction: column; gap: 14px; padding: 26px 28px; border: 1px solid #fff; border-radius: 24px; background: linear-gradient(145deg, #fffef9, #eaf0e8); box-shadow: 0 8px 25px -20px #17334466, inset 0 1px 0 white; animation: fade 240ms ease-out; }
  .call.focus { border-color: var(--accent); box-shadow: 0 0 0 3px #446c6033, 0 8px 25px -20px #17334466; }
  .call .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .call .head .when { margin-left: auto; font-size: 11px; color: var(--muted); }
  .call .req { font-size: 30px; line-height: 1.12; text-wrap: pretty; }
  .call .req::before { content: '“'; color: var(--accent); }
  .call .req::after { content: '”'; color: var(--accent); }
  .items { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .tally { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; font-size: 12px; color: var(--muted); }
  .tally b { font-weight: 600; color: var(--text); }
  .lims { margin: 0; padding-left: 18px; font-size: 12px; color: var(--muted); }
  details.lims-wrap summary, details.item summary { list-style: none; cursor: pointer; }
  details summary::-webkit-details-marker { display: none; }
  details.lims-wrap summary { font-size: 11px; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; }

  /* One plan item: one calm row; open it for the judgments. */
  details.item { border-bottom: 1px solid var(--line); }
  details.item summary { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 8px 16px; align-items: center; padding: 12px 4px; }
  details.item summary:hover { background: #ffffff70; }
  .verdict { display: inline-flex; align-items: center; justify-content: center; justify-self: start; min-height: 26px; padding: 0 12px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; border: 1px solid var(--line); color: var(--muted); background: #fffdf580; }
  .line { grid-column: 2; margin-top: -4px; font-size: 13px; line-height: 1.5; color: var(--muted); }
  .verdict.keep { background: var(--keep); border-color: var(--keep); color: #fffbed; }
  .verdict.simplify { border-color: var(--simplify); color: var(--simplify); background: #fff3ea; }
  .verdict.review { border-style: dashed; }
  .verdict.waiting { color: var(--muted); }
  .verdict.waiting::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 8px; animation: pulse 1.2s ease-in-out infinite; }
  .change { font-size: 15px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
  .change .flag { margin-left: 8px; font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--warm); }
  .glance { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  .glance .score { font-size: 12px; color: var(--muted); }
  .glance .score b { color: var(--text); font-weight: 600; }
  .glance .ms { font-size: 11px; color: var(--muted); }
  /* six tiny meters, one per judgment, readable at a glance */
  .strip { display: grid; grid-template-columns: repeat(6, 22px); gap: 3px; }
  .strip i { height: 6px; border-radius: 3px; background: #17334418; position: relative; overflow: hidden; }
  .strip i::after { content: ''; position: absolute; inset: 0; width: calc(var(--v, 0) * 100%); background: var(--tone, var(--accent)); border-radius: 3px; transition: width 420ms cubic-bezier(.2,.7,.2,1); }
  .strip i.on::after { --tone: var(--accent); }
  .strip i.warn::after { --tone: var(--warm); }
  .strip i.off::after { --tone: #17334455; }
  .strip i.na { background: repeating-linear-gradient(90deg, #17334418 0 3px, transparent 3px 6px); }
  .strip i.na::after { display: none; }

  .body { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px 16px; padding: 4px 4px 18px; }
  .body .why { grid-column: 2; font-size: 14px; color: var(--muted); font-style: italic; }
  .body .signals { grid-column: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 28px; }
  .sig .k { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .sig .k b { font-weight: 500; color: var(--text); }
  .sig.na { opacity: .55; }
  .meter { position: relative; height: 7px; border-radius: 4px; background: #17334418; }
  .meter i { position: absolute; inset: 0 auto 0 0; width: calc(var(--v, 0) * 100%); border-radius: 4px; background: var(--tone, var(--accent)); transition: width 420ms cubic-bezier(.2,.7,.2,1); }
  .meter b { position: absolute; top: -4px; left: calc(var(--t, .5) * 100%); width: 2px; height: 15px; margin-left: -1px; border-radius: 1px; background: #17334466; }
  .meter.on i { --tone: var(--accent); }
  .meter.warn i { --tone: var(--warm); }
  .meter.off i { --tone: #17334455; }
  .body .reason { grid-column: 2; font-size: 14px; line-height: 1.6; }
  .body details.ev { grid-column: 2; }
  .body details.ev summary { font-size: 11px; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
  .quote { margin-top: 8px; padding: 14px 18px; border-radius: 14px; background: var(--code-bg); color: var(--code-text); font: 12px/1.7 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }

  /* How it decides: closed by default, one panel under the header. */
  .how { border: 1px solid var(--line); border-radius: 20px; background: #fffdf580; }
  .how summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 22px; list-style: none; cursor: pointer; font-size: 14px; }
  .how summary::-webkit-details-marker { display: none; }
  .how summary .eyebrow { margin: 0; }
  .how-body { padding: 0 22px 22px; display: grid; gap: 14px; font-size: 13px; color: var(--muted); }
  .how-body b { color: var(--text); font-weight: 600; }
  .qs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .q { padding: 12px 14px; border-radius: 14px; background: #fffdf5; border: 1px solid var(--line); }
  .q .key { font: 11px var(--mono); color: var(--accent); margin-bottom: 4px; }
  .q .ins { font-size: 12.5px; color: var(--text); }

  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

  @media (max-width: 700px) {
    .wrap { width: calc(100% - 32px); }
    .bar { padding: 12px 16px; }
    .call { padding: 20px 18px; }
    .call .req { font-size: 25px; }
    details.item summary { grid-template-columns: 1fr; gap: 6px; }
    .line { grid-column: 1; }
    .body { grid-template-columns: 1fr; }
    .body .why, .body .signals, .body .reason, .body details.ev { grid-column: 1; }
    .body .signals { grid-template-columns: 1fr; }
  }

  /* ?mobile: a 9:16 frame for vertical recordings. Not persisted; the URL is the switch. */
  :root[data-mode="mobile"] body { align-items: center; justify-content: center; background: #0b1a20; }
  :root[data-mode="mobile"] .app { flex: none; width: 390px; height: 844px; overflow: hidden; border-radius: 28px; background: var(--bg); transform: scale(var(--phone-scale, 1)); transform-origin: center; }
  :root[data-mode="mobile"] .bar { padding: 16px 56px 12px 18px; gap: 6px 10px; }
  :root[data-mode="mobile"] .bar .btn, :root[data-mode="mobile"] .bar .eyebrow { display: none; }
  :root[data-mode="mobile"] .facts { margin-left: 0; width: 100%; gap: 2px 14px; }
  :root[data-mode="mobile"] .pane { padding: 16px 0 170px; }
  :root[data-mode="mobile"] .wrap { width: calc(100% - 74px); margin: 0 56px 0 18px; gap: 18px; }
  :root[data-mode="mobile"] .how { display: none; }
  :root[data-mode="mobile"] .call { padding: 18px 16px; gap: 10px; }
  :root[data-mode="mobile"] .call .req { font-size: 26px; }
  :root[data-mode="mobile"] details.item summary { grid-template-columns: 1fr; gap: 6px; padding: 12px 2px; }
  :root[data-mode="mobile"] .change { font-size: 15px; }
  :root[data-mode="mobile"] .line { grid-column: 1; font-size: 13px; }
  :root[data-mode="mobile"] .glance { justify-content: space-between; }
  :root[data-mode="mobile"] .strip { grid-template-columns: repeat(6, 26px); }
  :root[data-mode="mobile"] .body { grid-template-columns: 1fr; }
  :root[data-mode="mobile"] .body .why, :root[data-mode="mobile"] .body .signals, :root[data-mode="mobile"] .body .reason { grid-column: 1; }
  :root[data-mode="mobile"] .body .signals { grid-template-columns: 1fr; gap: 9px; }
  :root[data-mode="mobile"] .body details.ev { display: none; }
</style>
</head>
<body>
  <div class="app" id="app">
  <header class="bar">
    <a class="brand" href="/"><span class="name">bytesjev</span></a>
    <span class="eyebrow live" id="live"><i class="dot"></i>Planning checker · live</span>
    <div class="facts" id="facts"></div>
    <button class="btn" id="run" type="button">Run the example</button>
  </header>
  <div class="pane" id="pane">
    <div class="wrap" id="wrap">
      <details class="how" id="how">
        <summary><span class="eyebrow">How it decides</span><span style="font-size:12px;color:var(--muted)">the six questions and the thresholds</span></summary>
        <div class="how-body" id="how-body"></div>
      </details>
      <div id="calls" style="display:flex;flex-direction:column;gap:26px"></div>
    </div>
  </div>
  </div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  const h = (tag, attrs = {}, ...children) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style") el.style.cssText = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
    return el;
  };
  const fmt = (n) => (typeof n === "number" && Number.isFinite(n) ? n.toFixed(2) : "–");
  const clock = (t) => new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  // ---- ?mobile: the recording frame. The URL is the only switch; nothing is remembered.
  try { localStorage.removeItem("bytesjev.mode"); } catch {}
  const isMobile = params.has("mobile");
  if (isMobile) document.documentElement.dataset.mode = "mobile";
  const fitPhone = () => { if (isMobile) document.documentElement.style.setProperty("--phone-scale", Math.min(innerHeight / 844, innerWidth / 390).toFixed(4)); };
  fitPhone(); addEventListener("resize", fitPhone);

  // ---- thresholds mirror src/mcp/planning-checker.ts THRESHOLDS
  const T = { keep: 0.65, low: 0.35, support: 0.7, droppable: 0.7 };
  const SIGNALS = [
    { key: "necessary", label: "necessary", t: T.keep, tone: (v) => (v >= T.keep ? "on" : v < T.low ? "warn" : "off") },
    { key: "requested", label: "the request asks for it", t: T.support, tone: (v) => (v >= T.support ? "on" : "off") },
    { key: "convention", label: "follows a stated convention", t: T.support, tone: (v) => (v >= T.support ? "on" : "off"), na: "no repo context" },
    { key: "safety", label: "needed for correctness or security", t: T.support, tone: (v) => (v >= T.support ? "on" : "off") },
    { key: "speculative", label: "rationale is about the future", t: T.support, tone: (v) => (v >= T.support ? "warn" : "off") },
    { key: "droppable", label: "the rest of the plan suffices without it", t: T.droppable, tone: (v) => (v >= T.droppable ? "warn" : "off"), na: "only item" },
  ];

  const state = { model: "", calls: new Map(), count: 0, tokens: 0, questions: null };
  const pane = $("pane"), callsEl = $("calls");
  const follow = (el) => requestAnimationFrame(() => {
    const near = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 240;
    if (isMobile || near) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
  });

  function renderFacts() {
    const parts = [h("span", {}, "jev ", h("b", {}, state.model || "–"))];
    if (state.count) parts.push(h("span", {}, "checks ", h("b", { class: "num" }, String(state.count))));
    if (state.tokens) parts.push(h("span", {}, h("b", { class: "num" }, state.tokens.toLocaleString()), " tokens · ", h("b", { class: "num" }, `$${(state.tokens * 42 / 1e9).toFixed(4)}`)));
    $("facts").replaceChildren(...parts);
  }
  function renderEmpty() {
    if (callsEl.children.length) return;
    callsEl.replaceChildren(h("div", { class: "empty" }, h("b", {}, "Nothing judged yet."), "Every PlanningChecker call lands here as it happens: the request, each plan item, and what Jev made of it. Call the tool from Claude Code, or run the bundled example."));
  }

  const strip = (j) => h("span", { class: "strip", role: "img", "aria-label": j ? SIGNALS.map((s) => `${s.label} ${fmt(j[s.key])}`).join(", ") : "not judged yet" },
    SIGNALS.map((s) => { const v = j ? j[s.key] : null; return h("i", { class: j ? (v === null ? "na" : s.tone(v)) : "", style: `--v:${v == null ? 0 : v}` }); }));
  const meterRow = (s, j) => { const v = j[s.key]; const na = v === null; return h("div", { class: `sig${na ? " na" : ""}` },
    h("div", { class: "k" }, h("b", {}, s.label), h("span", { class: "num" }, na ? s.na : fmt(v))),
    h("div", { class: `meter ${na ? "off" : s.tone(v)}`, style: `--v:${na ? 0 : v};--t:${s.t}` }, h("i"), h("b"))); };

  function itemRow(it) {
    const d = h("details", { class: "item", "data-item": it.id },
      h("summary", {},
        h("span", { class: "verdict waiting" }, "judging"),
        h("span", { class: "change" }, it.change),
        h("span", { class: "glance" }, strip(null))),
      h("div", { class: "body" }, h("span"), it.rationale ? h("div", { class: "why" }, `“${it.rationale}”`) : h("span")));
    return d;
  }

  function onCall(m) {
    if (state.calls.has(m.id)) return;
    if (!callsEl.querySelector(".call")) callsEl.replaceChildren();
    const items = new Map();
    const card = h("section", { class: "call", id: m.id, "data-call": m.id },
      h("div", { class: "head" },
        h("span", { class: "eyebrow" }, m.source === "claude-code" ? "from Claude Code" : "from this page"),
        h("span", { class: "eyebrow" }, `${m.items.length} plan ${m.items.length === 1 ? "item" : "items"}`),
        h("span", { class: "eyebrow" }, m.context ? "with repo context" : "no repo context"),
        h("span", { class: "when num" }, clock(m.t))),
      h("h2", { class: "req" }, m.request),
      h("div", { class: "items" }, m.items.map((it) => { const r = itemRow(it); items.set(it.id, r); return r; })),
    );
    callsEl.append(card);
    state.calls.set(m.id, { el: card, items, msg: m });
    state.count += 1; renderFacts();
    if (m.questions) { state.questions = m.questions; renderHow(); }
    if (location.hash.slice(1) === m.id) reveal(card); else follow(card);
  }

  // A link from the status line lands on one check: open every item and scroll to it.
  function reveal(card) {
    card.classList.add("focus");
    for (const d of card.querySelectorAll("details.item")) d.open = true;
    requestAnimationFrame(() => card.scrollIntoView({ block: "start", behavior: "smooth" }));
  }
  addEventListener("hashchange", () => { const card = document.getElementById(location.hash.slice(1)); if (card) reveal(card); });

  function onItem(m) {
    const call = state.calls.get(m.id); if (!call) return;
    const row = call.items.get(m.itemId); if (!row) return;
    const j = m.judgment, r = m.result;
    const sum = row.querySelector("summary");
    sum.replaceChildren(...h("div", {},
      h("span", { class: `verdict ${r.recommendation}` }, r.recommendation),
      h("span", { class: "change" }, call.msg.items.find((i) => i.id === m.itemId).change, r.uncertain ? h("span", { class: "flag" }, "uncertain") : null),
      h("span", { class: "glance" }, h("span", { class: "score" }, "necessity ", h("b", { class: "num" }, fmt(r.necessity_score))), strip(j), h("span", { class: "ms num" }, `${m.ms} ms`)),
      h("span", { class: "line" }, r.reason),
    ).childNodes);
    const body = row.querySelector(".body");
    body.append(
      h("div", { class: "signals" }, SIGNALS.map((s) => meterRow(s, j))),
      r.evidence && r.evidence.length ? h("details", { class: "ev" }, h("summary", {}, "what it quoted"), h("div", { class: "quote" }, r.evidence.join("\n\n"))) : null,
    );
    if (typeof m.inputTokens === "number") state.tokens += m.inputTokens;
    renderFacts();
    follow(row);
  }

  function onDone(m) {
    const call = state.calls.get(m.id);
    if (!call) {
      callsEl.append(h("section", { class: "call" }, h("div", { class: "head" }, h("span", { class: "eyebrow", style: "color:var(--warm)" }, `status ${m.status}`), h("span", { class: "when num" }, clock(m.t))), m.errors ? h("ul", { class: "lims" }, m.errors.map((e) => h("li", {}, e))) : null));
      return;
    }
    const counts = { keep: 0, simplify: 0, review: 0 };
    for (const r of call.items.values()) { const v = r.querySelector(".verdict"); if (v && counts[v.textContent] !== undefined) counts[v.textContent] += 1; }
    const tally = h("div", { class: "tally" });
    if (m.status === "ok") {
      tally.append(h("span", {}, h("b", { class: "num" }, String(counts.keep)), " keep"), h("span", {}, h("b", { class: "num" }, String(counts.simplify)), " simplify"), h("span", {}, h("b", { class: "num" }, String(counts.review)), " review"), h("span", { class: "num" }, `${(m.ms / 1000).toFixed(1)}s`));
    } else {
      tally.append(h("span", { style: "color:var(--warm)" }, m.status === "unavailable" ? `Jev unavailable (${m.error}); the agent went ahead with its plan` : "invalid input"));
      for (const r of call.items.values()) r.querySelector(".verdict").replaceWith(h("span", { class: "verdict" }, "not judged"));
    }
    if (m.limitations && m.limitations.length) tally.append(h("details", { class: "lims-wrap" }, h("summary", {}, `${m.limitations.length} ${m.limitations.length === 1 ? "note" : "notes"}`), h("ul", { class: "lims" }, m.limitations.map((l) => h("li", {}, l)))));
    call.el.append(tally);
    follow(tally);
  }

  function renderHow() {
    const q = state.questions || {};
    $("how-body").replaceChildren(
      h("div", { class: "qs" }, Object.entries(q).map(([key, v]) => h("div", { class: "q" }, h("div", { class: "key" }, key), h("div", { class: "ins" }, v.instructions)))),
      h("div", {}, h("b", {}, "keep"), " when necessary ≥ 0.65, or the request or a stated convention supports it at ≥ 0.7. ", h("b", {}, "simplify"), " only when necessary < 0.35, the rest of the plan suffices at ≥ 0.7, no requested / convention / safety signal reaches 0.5, and there is more than one item. ", h("b", {}, "review"), " for everything else, always marked uncertain. Reasons quote the text the agent sent; nothing about the repository is invented."),
    );
  }
  renderHow();

  $("run").addEventListener("click", async () => { $("run").disabled = true; try { await fetch("/run", { method: "POST" }); } finally { setTimeout(() => { $("run").disabled = false; }, 1500); } });

  const es = new EventSource("/events");
  es.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "hello") { state.model = m.setup.model; renderFacts(); renderEmpty(); return; }
    if (m.type === "call") onCall(m);
    else if (m.type === "item") onItem(m);
    else if (m.type === "done") onDone(m);
  };
  es.onerror = () => { $("live").classList.remove("live"); $("live").replaceChildren(h("i", { class: "dot", style: "background:var(--warm)" }), "disconnected · is npm run viz still up?"); };
  renderFacts(); renderEmpty();
})();
</script>
</body>
</html>
